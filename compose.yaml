x-runtime: &runtime
    build: .
    working_dir: /var/www/html
    volumes:
        - .:/var/www/html
        # Dependencies live in a Docker volume instead of the host folder. On Windows/macOS,
        # reading thousands of vendor files through a bind mount is slow and can fail right
        # after composer install, so PHP loads them from the container filesystem instead.
        - vendor:/var/www/html/vendor
    networks:
        - order-payment-network

x-workflow: &workflow
    <<: *runtime
    restart: unless-stopped
    depends_on:
        setup:
            condition: service_completed_successfully
        redis:
            condition: service_healthy
        rabbitmq:
            condition: service_healthy

services:
    setup:
        <<: *runtime
        command: ["sh", "docker/setup.sh"]
        depends_on:
            mysql:
                condition: service_healthy

    app:
        <<: *runtime
        container_name: order-payment-app
        depends_on:
            setup:
                condition: service_completed_successfully
            redis:
                condition: service_healthy

    nginx:
        image: nginx:1.28-alpine
        container_name: order-payment-nginx
        ports:
            - "127.0.0.1:8080:80"
        volumes:
            - .:/var/www/html:ro
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            - app
        networks:
            - order-payment-network

    mysql:
        image: mysql:8.4
        container_name: order-payment-mysql
        environment:
            MYSQL_DATABASE: order_payment
            MYSQL_USER: order_user
            MYSQL_PASSWORD: order_password
            MYSQL_ROOT_PASSWORD: root_password
        ports:
            - "127.0.0.1:3307:3306"
        volumes:
            - mysql-data:/var/lib/mysql
        command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
        healthcheck:
            test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
            interval: 5s
            timeout: 5s
            retries: 20
        networks:
            - order-payment-network

    redis:
        image: redis:7.4-alpine
        container_name: order-payment-redis
        ports:
            - "127.0.0.1:6380:6379"
        volumes:
            - redis-data:/data
        command: ["redis-server", "--appendonly", "yes"]
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 3s
            retries: 10
        networks:
            - order-payment-network

    rabbitmq:
        image: rabbitmq:4.1-management-alpine
        container_name: order-payment-rabbitmq
        environment:
            RABBITMQ_DEFAULT_USER: order_user
            RABBITMQ_DEFAULT_PASS: order_password
            RABBITMQ_DEFAULT_VHOST: /
        ports:
            - "127.0.0.1:5673:5672"
            - "127.0.0.1:15672:15672"
        volumes:
            - rabbitmq-data:/var/lib/rabbitmq
        healthcheck:
            test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
            interval: 5s
            timeout: 5s
            retries: 20
        networks:
            - order-payment-network

    worker:
        <<: *workflow
        command: ["php", "artisan", "queue:work", "rabbitmq", "--queue=store.1", "--sleep=1", "--tries=3", "--timeout=20"]
        stop_grace_period: 30s

    worker-store-2:
        <<: *workflow
        command: ["php", "artisan", "queue:work", "rabbitmq", "--queue=store.2", "--sleep=1", "--tries=3", "--timeout=20"]
        stop_grace_period: 30s

    scheduler:
        <<: *workflow
        command: ["php", "artisan", "schedule:work"]
        environment:
            WORKFLOW_STORE_ID: 1

    scheduler-store-2:
        <<: *workflow
        command: ["php", "artisan", "schedule:work"]
        environment:
            WORKFLOW_STORE_ID: 2

    mysql-test:
        image: mysql:8.4
        profiles: ["test"]
        environment:
            MYSQL_DATABASE: order_payment_test
            MYSQL_USER: test_user
            MYSQL_PASSWORD: test_password
            MYSQL_ROOT_PASSWORD: test_root_password
        tmpfs:
            - /var/lib/mysql
        healthcheck:
            test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
            interval: 3s
            timeout: 5s
            retries: 30
        networks:
            - order-payment-network

    test:
        <<: *runtime
        profiles: ["test"]
        depends_on:
            mysql-test:
                condition: service_healthy
            redis:
                condition: service_healthy
            rabbitmq:
                condition: service_healthy
        environment:
            APP_ENV: testing
            DB_CONNECTION: mysql
            DB_HOST: mysql-test
            DB_PORT: 3306
            DB_DATABASE: order_payment_test
            DB_USERNAME: test_user
            DB_PASSWORD: test_password
            CACHE_STORE: array
            QUEUE_CONNECTION: database
            PAYMENT_QUEUE_CONNECTION: database
        command: ["php", "vendor/bin/phpunit", "--configuration=phpunit.integration.xml"]

volumes:
    vendor:
    mysql-data:
    redis-data:
    rabbitmq-data:

networks:
    order-payment-network:
        driver: bridge
